name: 雨量・水位データ自動更新

on:
  schedule:
    - cron: '15 * * * *'  # 毎時15分に最新データを自動取得
  workflow_dispatch:      # GitHub画面から手動実行（過去豪雨や長期間の指定が可能）
    inputs:
      start_date:
        description: '開始日 (YYYY-MM-DD)'
        required: false
        default: ''
      end_date:
        description: '終了日 (YYYY-MM-DD)'
        required: false
        default: ''

# GITHUB_TOKEN にリポジトリへの書き込み権限を付与
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest  # メモリ7GBの強力なLinux仮想マシン環境

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.js 20 のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 依存パッケージのインストール
        run: npm ci

      - name: 雨量・水位データの取得と解析
        run: |
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          
          if [ -z "$START" ] || [ -z "$END" ]; then
            # 期間未指定（定期実行時）: JST基準で「昨日〜今日」を算出
            # UTCから+9時間してJSTの日付を取得
            TODAY=$(date -u -d '+9 hours' '+%Y-%m-%d' 2>/dev/null || date -u -v+9H '+%Y-%m-%d')
            YESTERDAY=$(date -u -d '+9 hours -1 day' '+%Y-%m-%d' 2>/dev/null || date -u -v+9H -v-1d '+%Y-%m-%d')
            echo "定期実行: $YESTERDAY 〜 $TODAY を取得します"
            node process_data.js "$YESTERDAY" "$TODAY"
          else
            echo "手動期間指定: $START 〜 $END を取得します"
            node process_data.js "$START" "$END"
          fi

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rainfall_data.json waterlevel_data.json
          
          if git diff --staged --quiet; then
            echo "データに変更はありませんでした。"
          else
            git commit -m "data: 雨量・水位データの自動更新 [skip ci]"
            git push
          fi
